name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build

      - name: Publish single executable
        run: dotnet publish src/Crap4DotNet.Cli -c Release -r linux-x64 --self-contained true -o ./artifacts/publish

      - name: Verify published executable
        run: |
          test "$(find ./artifacts/publish -type f | wc -l)" -eq 1
          ./artifacts/publish/dotnet-crap --help

      - uses: actions/upload-artifact@v4
        with:
          name: dotnet-crap-linux-x64
          path: ./artifacts/publish/dotnet-crap

      - name: Pack CLI tool
        run: dotnet pack src/Crap4DotNet.Cli -o ./nupkg

      - name: Install dotnet-crap
        run: dotnet tool install -g Crap4DotNet --configfile nuget.ci.config --prerelease

      - name: Self-analyze with CRAP metrics
        continue-on-error: true
        run: dotnet-crap analyze ./crap4dotnet.sln --run-tests --output crap-report.json
